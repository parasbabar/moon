<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Half moon / eclipse motif — exactly half disclosed, half in shadow -->
  <circle cx="50" cy="50" r="45" fill="#1a1a2e"/>
  <!-- Right half bright (disclosed) -->
  <path d="M50 5 A45 45 0 0 1 50 95 Z" fill="#c0a9ff" opacity="0.85"/>
  <!-- Subtle glow ring -->
  <circle cx="50" cy="50" r="45" stroke="#7c5fe6" stroke-width="1.5" fill="none" opacity="0.4"/>
</svg>
